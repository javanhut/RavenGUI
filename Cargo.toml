[workspace]
resolver = "3"
members = [
    "crates/raven-protocol",
    "crates/raven-desktop",
    "crates/raven-fprint",
    "crates/raven-rec",
    "crates/raven-h264",
    "crates/raven-aac",
    "crates/raven-mp4",
    "crates/comp/huginn-core",
    "crates/comp/huginn-comp",
    "crates/comp/huginn-egl",
    "crates/tools/layer-probe",
    "crates/tools/raven-output",
    "crates/tools/raven-export",
    "crates/tools/raven-open",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/javanhutchinson/RavenGUI"

# Every crate inherits these via `[lints] workspace = true`.
# `forbid` cannot be locally overridden by an #[allow] anywhere in the crate.
# The single exception is `huginn-egl`, which declares its own [lints] table;
# `scripts/check-unsafe.sh` proves no other crate has quietly done the same.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
todo = "warn"
dbg_macro = "warn"

[workspace.dependencies]
raven-desktop = { path = "crates/raven-desktop" }
raven-fprint = { path = "crates/raven-fprint" }
raven-rec = { path = "crates/raven-rec" }
raven-h264 = { path = "crates/raven-h264" }
raven-aac = { path = "crates/raven-aac" }
raven-mp4 = { path = "crates/raven-mp4" }
huginn-core = { path = "crates/comp/huginn-core" }
huginn-egl = { path = "crates/comp/huginn-egl" }
raven-protocol = { path = "crates/raven-protocol" }

smithay = { version = "0.7", default-features = false }
smithay-client-toolkit = "0.21"
wayland-scanner = "0.31"
wayland-server = "0.31"
wayland-client = "0.31"
wayland-backend = "0.3"
calloop = "0.14"
# Watching the application directories for installs. The safe wrapper rather
# than raw `inotify_add_watch`, because this workspace forbids unsafe code.
inotify = { version = "0.11", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# The one file the desktop reads about itself: ~/.config/raven/desktop.toml,
# written by raven-settings. See huginn-comp/src/desktop_config.rs.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# BlueZ, for the quick settings Bluetooth row. Blocking API only: the
# connection runs its executor on a thread of its own, and the compositor
# talks to it from a thread of its own too, so no async runtime enters the
# frame loop.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# zbus's name-request flags are enumflags2 bit sets, and the notifications
# server has to spell "no flags at all": the type's `Default` is not empty. See
# huginn-comp/src/notifications/bus.rs. Already in the tree through zbus.
enumflags2 = "0.7"
# Text shaping, layout and rasterization for the compositor-drawn shell.
# `default-features = false` drops fontconfig, which would put a C library on
# the critical path of a distro that ships almost no GUI dependencies; fontdb
# finds fonts by scanning the standard directories without it.
# SVG rasterization for application icons. `text` and `system-fonts` are off:
# an icon that relies on glyphs is vanishingly rare, and enabling them drags
# fontdb and a font database scan into the icon path for nothing. `svgz` stays
# because real icon themes ship compressed SVGs.
resvg = { version = "0.48", default-features = false, features = ["svgz"] }

# The wallpaper's decoders. resvg's tiny-skia reads PNG already, but only as an
# icon-sized pixmap and not JPEG at all, and a photograph is the one thing a
# wallpaper usually is. Both are pure Rust, which is what lets the compositor
# decode a file at startup without a C library on the path to a working
# desktop. RavenLogin's greeter reads the same two formats, by the same two
# crates, for the same file.
png = "0.18"
# Default features off because those are the SIMD paths, which are `unsafe` by
# construction; `std` is what is left.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }

[profile.dev]
opt-level = 1          # a compositor at opt-level 0 drops frames while you test

[profile.dev.package."*"]
opt-level = 3          # deps are rebuilt rarely; always optimize them

[profile.release]
# Until this table existed there was no release profile here at all, which
# meant `imlazy build` and stage-gui.sh shipped huginn at cargo's defaults —
# LTO off, sixteen codegen units — and nothing in the compositor was ever
# inlined into anything else in the compositor. That matters more here than
# anywhere else in the tree, because this workspace root governs huginn
# together with raven-desktop and with raven-rec, raven-h264, raven-aac and
# raven-mp4, and the boundaries between them are crossed per frame: the render
# loop goes through huginn-comp into huginn-core and raven-desktop on the way
# to every damage rectangle, and a screen recording crosses into the codecs
# sixty times a second for as long as it runs.
#
# `fat` rather than `thin` because of where the two costs land. Link time is
# paid once, on a build host, by the stage that makes an ISO. Frame time is
# paid on every machine that boots the result, for the whole length of every
# session. That trade is close in most of this tree and is not close here, so
# the slow link is deliberate: whole-program LTO over fourteen members plus
# the vendored smithay below is minutes, not seconds, and stage-gui.sh will
# feel it.
#
# This is the opposite choice from RavenLinux/init for the opposite reason.
# raven-init is read off disk once during the busiest part of boot and then
# sleeps for the life of the machine, so it optimizes for size; huginn is
# never not working. Copying a boot-path profile into a compositor is the
# specific mistake this comment exists to prevent, and RavenCanvas/Cargo.toml
# has the measurement — 119 ms against 81 ms for one 1080p frame — that
# settles the general case in the graphics path.
#
# Note that this does not reach the codec crates everywhere they are built.
# RavenCamera patches raven-h264/raven-aac/raven-mp4/raven-rec to ../RavenGUI
# in its own .cargo/config.toml, so inside that build they compile under
# RavenCamera's profile, not this one.
#
# Deliberately no `panic = "abort"`, on CrowTextEditor's precedent: anything
# with work left to do on the way out keeps unwinding. Nothing here installs a
# panic hook today, so abort would have to be argued on binary size alone —
# and against it stands the seat and the DRM master, which LibSeatSession
# releases from Drop, and which an abort leaves the tty still holding.
opt-level = 3
lto = "fat"
codegen-units = 1

# Patched smithay: upstream 0.7.0 creates the drag-and-drop `wl_data_offer` at
# the client's own `wl_data_device` version and then sends `source_actions` on
# it unconditionally. That event is new in version 3, so a client that binds
# `wl_data_device_manager` at version 1 — GLFW 3.3 does, which is every app
# built on it, RavenTerminal included — receives an opcode its listener has no
# slot for, and libwayland-client answers that by aborting the process:
#
#   listener function for opcode 1 of wl_data_offer is NULL
#
# The window vanishes the instant a drag crosses it. third_party/smithay gates
# both sends on the offer's version; drop it once upstream carries the fix.
[patch.crates-io]
smithay = { path = "third_party/smithay" }
