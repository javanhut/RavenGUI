# RavenGUI's build interface.
#
# The compositor is developed nested — `imlazy run` puts a whole desktop in a
# window inside the session you are already in — and installed over the one the
# image shipped with `imlazy install`, which is reversible with `imlazy restore`.

[settings]
default = "help"

[variables]
comp = "-p huginn-comp"
probe = "-p layer-probe"

[commands.help]
desc = "Show RavenGUI's commands"
run = ["imlazy list"]

[commands.build]
desc = "Build the compositor, optimised"
run = ["cargo build --release {{comp}}"]

[commands.install]
desc = "Replace the installed huginn with this tree's"
run = ["./scripts/install.sh install"]

[commands.restore]
desc = "Put the originals back, undoing an install"
run = ["./scripts/install.sh restore"]

[commands.installed]
desc = "Show what is installed and where it came from"
run = ["./scripts/install.sh status"]
alias = ["status"]

[commands.run]
desc = "Run the compositor nested in the current session"
run = ["cargo run {{comp}}"]
alias = ["nested"]

[commands.probe]
desc = "Run the layer-shell probe against a nested compositor (WAYLAND_DISPLAY=wayland-N)"
run = ["cargo run {{probe}} -- --interactivity exclusive --cycle 2"]

[commands.check]
desc = "Typecheck the workspace"
run = ["cargo check --workspace --all-targets"]

[commands.test]
desc = "Run every test"
run = ["cargo test --workspace"]

[commands.lint]
desc = "Clippy, and prove no crate has escaped the unsafe quarantine"
run = ["cargo clippy --workspace --all-targets -- -D warnings", "./scripts/check-unsafe.sh"]

[commands.fmt]
desc = "Format the workspace"
run = ["cargo fmt --all"]

[commands.clean]
desc = "Remove build output"
run = ["cargo clean"]
