[package]
name = "raven-protocol"
description = "The raven_shell_v1 Wayland protocol: the contract between the Huginn compositor and the desktop software around it. Kept standalone and versioned so it can be split into its own repo at v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The compositor implements the server side; shell clients implement the client
# side. Neither needs the other's generated code, and keeping them apart means a
# client bug can never reach for a server-only type.
server = ["dep:wayland-server"]
client = ["dep:wayland-client"]

[dependencies]
wayland-backend.workspace = true
wayland-scanner.workspace = true
wayland-server = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
# The generated code spells bitfield enums — raven_capture_v1.options — as
# `bitflags!`, and names the crate from the caller's side. Already in the tree
# through wayland-server and wayland-client; declared here, not in the
# workspace, since this crate is meant to move to its own repository.
bitflags = "2"



[lints]
workspace = true
