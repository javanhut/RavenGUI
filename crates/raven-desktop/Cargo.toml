[package]
name = "raven-desktop"
description = "XDG desktop entries and icon theme lookup for the Raven launcher and dock. Host-agnostic: builds and tests anywhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
resvg = { workspace = true, optional = true }

[features]
# Rasterising icons is the launcher's and dock's business. Something that only
# needs to know what is installed and how to run it -- raven-open -- builds
# without it and without resvg's weight.
default = ["pixmap"]
pixmap = ["dep:resvg"]

[lints]
workspace = true
