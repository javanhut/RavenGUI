[package]
name = "huginn-comp"
description = "The Huginn Wayland compositor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-core.workspace = true
raven-desktop.workspace = true
tracing.workspace = true
cosmic-text.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
huginn-egl.workspace = true
# For dev_t in the dmabuf main-device hint. No unsafe involved: the type is a
# plain integer alias.
libc = "0.2"
raven-protocol = { workspace = true, features = ["server"] }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
calloop.workspace = true
# Already in the tree via winit; used to load the system cursor theme.
xcursor = "0.3"

[lints]
workspace = true
