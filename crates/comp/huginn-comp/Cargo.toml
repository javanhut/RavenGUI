[package]
name = "huginn-comp"
description = "The Huginn Wayland compositor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-core.workspace = true
raven-desktop.workspace = true
raven-rec.workspace = true
png.workspace = true
zune-jpeg.workspace = true
tracing.workspace = true
cosmic-text.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
huginn-egl.workspace = true
# For dev_t in the dmabuf main-device hint. No unsafe involved: the type is a
# plain integer alias.
libc = "0.2"
# For kill(2) behind the force-close binding. `libc::kill` is an `unsafe fn`
# and this workspace forbids unsafe; rustix wraps the same syscall safely and
# is already in the tree through smithay, so this adds a feature, not a crate.
rustix = { version = "1", features = ["process"] }
raven-protocol = { workspace = true, features = ["server"] }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    # XWayland: pulls in x11rb (composite/xfixes/randr) and the X11 window
    # manager smithay expects the compositor to implement. Without this the
    # `xwayland` module does not exist and X11 clients have nothing to talk to.
    "xwayland",
] }
calloop.workspace = true
inotify.workspace = true
zbus.workspace = true
enumflags2.workspace = true
# Already in the tree via winit; used to load the system cursor theme.
xcursor = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Peer-to-peer connections, so the notifications server is tested over a real
# socket without a session bus. Tests only: the resolver keeps this feature out
# of the compositor itself.
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
