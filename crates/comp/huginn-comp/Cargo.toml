[package]
name = "huginn-comp"
description = "The Huginn Wayland compositor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-core.workspace = true
raven-config.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
huginn-egl.workspace = true
raven-protocol = { workspace = true, features = ["server"] }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
calloop.workspace = true

[lints]
workspace = true
